# o site e o /api atrás do Caddy da VPS, que cuida do domínio e do HTTPS e manda tudo pra cá
# (liberdade:80 na rede docker "web")

# WebSocket do /api/gateway: repassa o pedido de upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # o IP de quem acessa (o Caddy já manda no X-Forwarded-For): o backend usa no limite de requisições
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # sem o proxy da Cloudflare na frente, esse cabeçalho viria de quem acessa e burlaria o
        # limite de requisições. Se ligar o proxy (nuvem laranja), tire esta linha
        proxy_set_header Cf-Connecting-Ip "";
        # o gateway fica aberto sem mandar nada às vezes: o padrão (60 s) derrubaria ele
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        # upload de imagem: o backend aceita até 4 MB
        client_max_body_size 5m;
    }

    # os arquivos do build têm hash no nome: pode guardar pra sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # o resto é o site (as rotas como /convite/<id> caem no index.html)
    location / {
        try_files $uri /index.html;
    }
}
