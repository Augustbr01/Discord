# produção na VPS: o backend e o site.
#   docker compose -f docker-compose.producao.yml up -d --build
# As variáveis vêm do .env do lado deste arquivo (modelo em .env.exemplo).
# Tudo fica na rede docker "web", a mesma do Caddy e do Postgres que já rodam na VPS:
# - o Caddy cuida do domínio e do HTTPS e manda tudo pro site (nginx), que repassa /api pro backend.
#   No Caddyfile de lá:
#     liberdade.augustdev.com.br {
#         reverse_proxy liberdade:80
#     }
# - o banco é o do DATABASE_URL do .env, pelo nome do container dele na rede
# O docker-compose.yml continua sendo o banco de desenvolvimento.
services:
  liberdade-backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      # o IP de quem acessa vem no X-Forwarded-For (Caddy da VPS → nginx)
      TRUST_PROXY: "true"
    networks:
      - web

  # o nome do serviço é o endereço que o Caddy da VPS usa (liberdade:80)
  liberdade:
    build: ./frontend
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - liberdade-backend

networks:
  web:
    external: true
