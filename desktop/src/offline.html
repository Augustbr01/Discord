<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Liberdade</title>
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            background: #09090b;
            color: #ededef;
            font: 14px/1.5 "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
        p { margin: 0 0 20px; color: #85858e; }
        button {
            padding: 8px 16px;
            border: 0;
            border-radius: 8px;
            background: #ededef;
            color: #09090b;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div>
        <h1>Sem conexão com o Liberdade</h1>
        <p>Tentando de novo sozinho a cada poucos segundos.</p>
        <button id="tentar">Tentar agora</button>
    </div>
    <script>
        // o main manda o endereço que falhou; volta pra ele (sem endereço, não tem pra onde ir)
        const site = new URLSearchParams(location.search).get("site");
        const tentar = () => site && location.replace(site);
        document.getElementById("tentar").addEventListener("click", tentar);
        window.addEventListener("online", tentar);
        setTimeout(tentar, 5000);
    </script>
</body>
</html>
